{% extends "base.html" %}
{% block title %}Log in · {{ app_name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn">Log in</button>
  </form>
  <p class="muted">No account? <a href="/signup">Sign up</a></p>
</div>
{% endblock %}
