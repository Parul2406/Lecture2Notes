{% extends "base.html" %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create an account</h1>
  {% if errors %}
    <div class="flash flash-error"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>
  {% endif %}
  <form method="post" action="/signup" class="stack">
    <fieldset class="roles">
      <legend>I am a</legend>
      <label class="role-option">
        <input type="radio" name="role" value="teacher" {% if form.role == 'teacher' %}checked{% endif %} required>
        <span><strong>Teacher</strong><small>Upload lectures</small></span>
      </label>
      <label class="role-option">
        <input type="radio" name="role" value="student" {% if form.role == 'student' %}checked{% endif %}>
        <span><strong>Student</strong><small>Read lecture transcripts</small></span>
      </label>
    </fieldset>
    <label>Full name <input name="name" value="{{ form.name or '' }}" required maxlength="120" autocomplete="name"></label>
    <label>Email <input type="email" name="email" value="{{ form.email or '' }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Log in</a></p>
</div>
{% endblock %}
